[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warhammer-gadget"
version = "0.0.1"
description = "Compact Warhammer toolbox with datasheets, dice rolling, and TUI interface"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Badwolfunit" email = "badwolfunit@icloud.com"}]
dependencies = [
    "dice-lib>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["warhammer_gadget"]

[tool.setuptools.package-data]
warhammer_gadget = ["datasheets_data/*.json"]